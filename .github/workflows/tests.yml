name: Tests

on: [push, pull_request]

jobs:
  test:
    name: JavaScript Test Action
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Setup mise
        uses: jdx/mise-action@v2

      - name: Install dependencies
        run: aube ci

      - name: Cache Playwright browsers
        uses: actions/cache@v3
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: aube exec playwright install --with-deps chromium firefox webkit

      - name: Install Playwright System Dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: aube exec playwright install-deps chromium firefox webkit

      - name: Check Formatting
        run: aube run format:check

      - name: Lint
        run: aube run lint

      - name: Typecheck
        run: aube run typecheck

      - name: Build
        run: aube run build

      - name: Check Package
        run: aube run check:package

      - name: Run Unit Tests With Coverage
        run: aube run test --coverage

      - name: Run Browser Tests
        run: aube run test:browser
        env:
          # A different start on each run, so repeated runs try new seeds.
          VITE_MORPHLEX_FUZZ_MOVE_SEEDS: 2000
          VITE_MORPHLEX_FUZZ_MOVE_SEED_START: ${{ github.run_id }}
          VITE_MORPHLEX_FUZZ_CHOICE_SEEDS: 2000
          VITE_MORPHLEX_FUZZ_CHOICE_SEED_START: ${{ github.run_id }}
          VITE_MORPHLEX_FUZZ_TEXT_SEEDS: 2000
          VITE_MORPHLEX_FUZZ_TEXT_SEED_START: ${{ github.run_id }}
