name: Bench probe

# Temporary: measures how stable A/A benchmarks are on GitHub's standard runners.
on:
  push:
    branches: [claude/project-thread-i8p1ir]

jobs:
  probe:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        run: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: aube ci
      - run: aube exec playwright install --with-deps chromium chromium-headless-shell
      - run: nproc; lscpu | head -20; ls /sys/bus/event_source/devices/; python3 bench-probe/pmu.py
      - run: node bench-probe/build.mjs src/morphlex.ts bench-probe/v/a.js morphlex && cp bench-probe/v/a.js bench-probe/v/b.js
      - run: sudo apt-get install -y valgrind
      - run: cp bench-probe/v/a.js bench-probe/a.js
      - name: Valgrind instruction counts
        run: |
          find ~/.cache/ms-playwright -maxdepth 3
          time (for r in 0 1; do for i in 1 2; do bench-probe/vg.sh "keyed%201000%20edit%20all" $r & done; done; wait)
          find ~/.cache/ms-playwright -maxdepth 3; time (for r in 0 1; do for i in 1 2; do bench-probe/vg.sh "attr%20churn%201000" $r & done; done; wait)
