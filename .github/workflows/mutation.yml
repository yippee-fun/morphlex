name: Mutation Testing

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

jobs:
  mutation:
    name: Stryker
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v3

      - name: Setup mise
        uses: jdx/mise-action@v2

      - name: Install dependencies
        run: aube ci

      # Pushes and pull requests only test the mutants their changes affect, starting from the last result on main.
      - name: Restore incremental results
        uses: actions/cache/restore@v4
        with:
          path: reports/stryker-incremental.json
          key: stryker-incremental-${{ github.run_id }}
          restore-keys: stryker-incremental-

      - name: Run Stryker
        run: aube run test:mutation ${{ github.event_name == 'schedule' && '--force' || '' }}

      - name: Save incremental results
        if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: reports/stryker-incremental.json
          key: stryker-incremental-${{ github.run_id }}

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stryker-report
          path: reports/mutation/
